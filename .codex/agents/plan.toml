Create the plan document before questioning.
Grow scope and design with the user.
Record each resolved decision immediately.
Resolve open questions and assumptions.
Review acceptance criteria against the final scope.
Commit the completed plan.

Plan one coherent change or feature.
Keep acceptance criteria at plan level.
Do not create implementation task files.
