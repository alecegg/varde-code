# Built-in rules: hardcoded-credential-literal
#
# Flags string literals assigned to credential-named variables. Two rules
# because a pattern-kind rule carries one `pattern` and the shapes differ:
# plain assignment (`KEY = "..."` — the Python norm, and JS reassignment)
# vs. declaration (`const KEY = "..."` — the JS/TS norm; the const pattern
# also matches `let` declarators, since declaration keywords are anonymous
# tokens that the matcher strips as trivia).
#
# Constraint design (the doc's highest-FP rule, tuned for default-on):
# - KEY is an anchored, case-insensitive credential-name list: bare
#   identifiers only, so `config.api_key = ...` (member LHS) and
#   `client_id = ...` never fire. Anchored because the engine applies
#   regexes with unanchored `is_match` (see pattern.rs filter_matches).
# - VAL must be a quoted literal of >= 16 chars with at least one digit
#   followed by 15+ more chars, from the base64-ish alphabet
#   [A-Za-z0-9_-+/=] (shape `[*][0-9]{15,}`: the digit may sit anywhere,
#   a `{15}[0-9]` prefix form was tried and wrongly required the digit at
#   exactly position 15, dropping alternating hex like `9f8d7c6b...`).
#   The digit requirement is the placeholder killer: `"your-api-key-here"`,
#   `"changeme"`, `"correcthorsebatterystaple"` carry no digits and drop
#   out without engine support for lookaheads. `<...>` placeholders and
#   short junk like `"hunter2"` fail the alphabet/length checks.
# - Non-literal values (`process.env.X`, `compute_token()`) fail the VAL
#   shape entirely. The regex engine is Rust `regex` (no lookaheads), so
#   negative exclusion is done by positive shape instead.
#
# Real-repo noise check: see BUILT_IN_RULES.md #8 — probed against local
# JS/TS corpora with the exact constraints below; only genuine-looking
# key material fired.
[[rule]]
id = "hardcoded-credential-literal"
kind = "pattern"
severity = "warning"
name = "Hardcoded credential literal"
description = "A string literal is assigned to a credential-named variable."
message = "hardcoded credential literal: a secret-like string is assigned to a credential-named variable"
remediation = "load the credential from an environment variable or secret store, never commit it"
pattern = "$KEY = $VAL"
languages = ["python", "javascript", "typescript", "tsx"]
[rule.constraints]
KEY = "^(?i)(api[_-]?key|access[_-]?key|client[_-]?secret|secret|password|passwd|credential|(access|auth|refresh|id|session)[_-]?token|token)$"
VAL = "^[\"'][A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]{15,}[\"']$"

[[rule]]
id = "hardcoded-credential-declaration"
kind = "pattern"
severity = "warning"
name = "Hardcoded credential declaration"
description = "A const/let declaration binds a string literal to a credential-named variable."
message = "hardcoded credential declaration: a secret-like string is declared as a credential-named variable"
remediation = "load the credential from an environment variable or secret store, never commit it"
pattern = "const $KEY = $VAL"
languages = ["javascript", "typescript", "tsx"]
[rule.constraints]
KEY = "^(?i)(api[_-]?key|access[_-]?key|client[_-]?secret|secret|password|passwd|credential|(access|auth|refresh|id|session)[_-]?token|token)$"
VAL = "^[\"'][A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]{15,}[\"']$"
